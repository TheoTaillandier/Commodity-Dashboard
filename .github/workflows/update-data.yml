name: Actualiser le Commodity Cockpit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commodity-cockpit-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les calculs
        run: python -m unittest discover -s tests -v
      - name: Compiler et publier l’interface avec l’instantané conservé
        run: |
          python scripts/build_dashboard.py
          node --check app/cockpit.js
          node tests/test_power_metrics.cjs
          git add index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Compiler l’interface autonome du cockpit'
            git push
          fi
      - name: Collecter les publications officielles
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          EEX_NGP_REDISTRIBUTION_ALLOWED: ${{ vars.EEX_NGP_REDISTRIBUTION_ALLOWED }}
        run: python scripts/update_data.py
      - name: Publier la nouvelle version ouvrable hors ligne
        run: |
          git add index.html README.md data/snapshot.json data/power_fr.json data/power_prices.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Actualiser les données officielles du cockpit'
            git push
          fi

